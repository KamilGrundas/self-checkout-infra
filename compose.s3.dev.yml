# Development-only, replaceable S3-compatible provider selected for the normal
# dev runtime. Applications continue to use the generic `s3-provider` contract.
services:
  s3-provider:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command:
      - server
      - /data
      - --address
      - ":8080"
      - --console-address
      - ":8081"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID?Variable not set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY?Variable not set}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:8083:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  prestart:
    depends_on:
      s3-provider:
        condition: service_healthy

  backend:
    depends_on:
      s3-provider:
        condition: service_healthy

  ml:
    depends_on:
      s3-provider:
        condition: service_healthy

  ml-worker:
    depends_on:
      s3-provider:
        condition: service_healthy

  ml-autolabel-worker:
    depends_on:
      s3-provider:
        condition: service_healthy

volumes:
  minio-data:
