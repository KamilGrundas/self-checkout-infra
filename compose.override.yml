services:
  db:
    image: docker.io/postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}

  prestart:
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connect_timeout=${DB_CONNECT_TIMEOUT:-10}

  backend:
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
      mailcatcher:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connect_timeout=${DB_CONNECT_TIMEOUT:-10}
      SMTP_HOST: mailcatcher
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - fastapi
      - run
      - --reload
      - app/main.py

  admin:
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"

  ml:
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    command:
      - fastapi
      - run
      - --reload
      - app/main.py
    depends_on:
      redis:
        condition: service_healthy

  ml-worker:
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  ml-autolabel-worker:
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: docker.io/redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - training-queue-data:/data

  mailcatcher:
    image: docker.io/sj26/mailcatcher:v0.10.0@sha256:5d153a4daadf0c266f29c3856085741f06ca1e3768671f4267622d3e3ffe5564
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"

volumes:
  app-db-data:
  training-queue-data:
