services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0-full@sha256:73365f742d67ef9e59e50118010bf14ff825a157c8244051baea887b8587e772
    restart: "no"
    ports:
      - "5002:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=${MLFLOW_SERVER_ALLOWED_HOSTS?Variable not set}
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  label-studio:
    image: heartexlabs/label-studio:1.23.0@sha256:aa461572e8f9d86a1bf9520c1db620204e86160fd2f80dd7e9d40ac84a8828ea
    restart: "no"
    ports:
      - "8080:8080"
    volumes:
      - label-studio-data:/label-studio/data
    env_file:
      - .env
    environment:
      - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME?Variable not set}
      - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD?Variable not set}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY?Variable not set}
      - S3_TRUSTED_STORAGE_DOMAINS=
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/version', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mlflow-data:
  label-studio-data:
