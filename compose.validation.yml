services:
  backend:
    environment:
      FRONTEND_HOST: http://localhost:5173
      BACKEND_PUBLIC_URL: http://backend:8000
      BACKEND_CORS_ORIGINS: http://localhost:5173
      SMTP_HOST: mailcatcher
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_SSL: "false"
    depends_on:
      mailcatcher:
        condition: service_started

  mailcatcher:
    image: sj26/mailcatcher:v0.10.0@sha256:5d153a4daadf0c266f29c3856085741f06ca1e3768671f4267622d3e3ffe5564
    restart: "no"

  backend-validation:
    build:
      context: ../self-checkout-backend
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ../self-checkout-backend:/workspace
      - backend-validation-venv:/workspace/.venv
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://s3-contract-test:4566
      S3_ACCESS_KEY_ID: contract-test
      S3_SECRET_ACCESS_KEY: contract-test
      S3_CREATE_BUCKETS: "true"
    depends_on:
      db:
        condition: service_healthy
      s3-contract-test:
        condition: service_healthy
    command:
      - bash
      - -lc
      - uv sync --frozen --group dev && export PATH=/workspace/.venv/bin:$$PATH && bash scripts/lint.sh && bash scripts/tests-start.sh

  admin-validation:
    build:
      context: ../self-checkout-admin
      dockerfile: Dockerfile.validation
    working_dir: /workspace
    volumes:
      - ../self-checkout-admin:/workspace
      - admin-validation-node-modules:/workspace/node_modules
      - admin-validation-auth:/workspace/playwright/.auth
      - admin-validation-results:/workspace/test-results
      - admin-validation-report:/workspace/playwright-report
      - admin-validation-blob-report:/workspace/blob-report
    env_file:
      - .env
    environment:
      CI: "true"
      VITE_API_URL: http://backend:8000
      VITE_ML_API_URL: http://ml:8000
      MAILCATCHER_HOST: http://mailcatcher:1080
    depends_on:
      backend:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    command:
      - bash
      - -lc
      - npm ci && npx biome check --no-errors-on-unmatched --files-ignore-unknown=true src tests biome.json vite.config.ts playwright.config.ts openapi-ts.config.ts && npm run build && npm test

  ml-validation:
    build:
      context: ../self-checkout-ml
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ../self-checkout-ml:/workspace
      - ml-validation-venv:/workspace/.venv
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: http://s3-contract-test:4566
      S3_ACCESS_KEY_ID: contract-test
      S3_SECRET_ACCESS_KEY: contract-test
      S3_CREATE_BUCKETS: "true"
    depends_on:
      s3-contract-test:
        condition: service_healthy
    command:
      - bash
      - -lc
      - uv sync --frozen --group dev && uv run ruff check app tests && uv run ruff format app tests --check && uv run pytest -q

  s3-contract-validation:
    build:
      context: ../self-checkout-ml
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: local
      S3_ENDPOINT_URL: http://s3-contract-test:4566
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: contract-test
      S3_SECRET_ACCESS_KEY: contract-test
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      S3_VERIFY_TLS: "true"
      S3_CREATE_BUCKETS: "true"
      S3_SHELF_BUCKET: contract-shelf
      S3_SCALE_BUCKET: contract-scale
      S3_EXTERNAL_BUCKET: contract-external
      S3_TRAINING_BUCKET: contract-training
    depends_on:
      s3-contract-test:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        from app.core.object_storage import get_object_storage
        storage = get_object_storage()
        bucket = "contract-shelf"
        storage.ensure_bucket_exists(bucket)
        storage.put_bytes(bucket, "contract/data.bin", b"unchanged", content_type="application/octet-stream")
        assert storage.get_bytes(bucket, "contract/data.bin") == b"unchanged"
        assert [item.object_name for item in storage.list_objects(bucket, "contract/")] == ["contract/data.bin"]
        assert storage.head_object(bucket, "contract/data.bin").content_type == "application/octet-stream"
        storage.delete_objects(bucket, ["contract/data.bin"])
        assert list(storage.list_objects(bucket, "contract/")) == []

  client-validation:
    build:
      context: ../self-checkout-client
      dockerfile: Dockerfile.validation
    working_dir: /workspace
    volumes:
      - ../self-checkout-client:/workspace
      - client-validation-target:/workspace/target

  integration-validation:
    image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    depends_on:
      backend:
        condition: service_healthy
      ml:
        condition: service_healthy
    command:
      - sh
      - -ec
      - curl -fsS http://backend:8000/api/v1/utils/health-check/ && curl -fsS http://ml:8000/api/v1/utils/health-check/ && curl -fsS http://admin/

volumes:
  backend-validation-venv:
  admin-validation-node-modules:
  admin-validation-auth:
  admin-validation-results:
  admin-validation-report:
  admin-validation-blob-report:
  ml-validation-venv:
  client-validation-target:
