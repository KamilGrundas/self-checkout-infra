services:
  db:
    image: postgres:18.4
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY?Variable not set}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY?Variable not set}

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY";
        do sleep 1; done &&
        mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
        mc mb --ignore-existing local/$$ML_MINIO_SHELF_BUCKET_NAME &&
        mc mb --ignore-existing local/$$ML_MINIO_SCALE_BUCKET_NAME &&
        mc mb --ignore-existing local/$$ML_MINIO_EXTERNAL_BUCKET_NAME &&
        mc mb --ignore-existing local/$$ML_MINIO_TRAINING_BUCKET_NAME &&
        mc mb --ignore-existing local/$$ML_MINIO_LABELSTUDIO_EXPORT_BUCKET_NAME
    env_file:
      - .env
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY?Variable not set}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY?Variable not set}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME?Variable not set}
      - ML_MINIO_SHELF_BUCKET_NAME=${ML_MINIO_SHELF_BUCKET_NAME?Variable not set}
      - ML_MINIO_SCALE_BUCKET_NAME=${ML_MINIO_SCALE_BUCKET_NAME?Variable not set}
      - ML_MINIO_EXTERNAL_BUCKET_NAME=${ML_MINIO_EXTERNAL_BUCKET_NAME?Variable not set}
      - ML_MINIO_TRAINING_BUCKET_NAME=${ML_MINIO_TRAINING_BUCKET_NAME?Variable not set}
      - ML_MINIO_LABELSTUDIO_EXPORT_BUCKET_NAME=${ML_MINIO_LABELSTUDIO_EXPORT_BUCKET_NAME?Variable not set}

  prestart:
    image: ${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}
    build:
      context: ../self-checkout-backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT?Variable not set}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY?Variable not set}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY?Variable not set}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME?Variable not set}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL?Variable not set}
      - MINIO_USE_SSL=${MINIO_USE_SSL?Variable not set}

  backend:
    image: ${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT?Variable not set}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY?Variable not set}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY?Variable not set}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME?Variable not set}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL?Variable not set}
      - MINIO_USE_SSL=${MINIO_USE_SSL?Variable not set}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: ../self-checkout-backend
      dockerfile: Dockerfile

  admin:
    image: ${DOCKER_IMAGE_ADMIN?Variable not set}:${TAG-latest}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    build:
      context: ../self-checkout-admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL?Variable not set}

  ml:
    image: ${DOCKER_IMAGE_ML?Variable not set}:${TAG-latest}
    restart: always
    depends_on:
      - minio
      - minio-init
    env_file:
      - .env
    environment:
      - PROJECT_NAME=Self-Checkout ML
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT?Variable not set}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY?Variable not set}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY?Variable not set}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL?Variable not set}
      - MINIO_USE_SSL=${MINIO_USE_SSL?Variable not set}
      - ML_MINIO_SHELF_BUCKET_NAME=${ML_MINIO_SHELF_BUCKET_NAME?Variable not set}
      - ML_MINIO_SCALE_BUCKET_NAME=${ML_MINIO_SCALE_BUCKET_NAME?Variable not set}
      - ML_MINIO_EXTERNAL_BUCKET_NAME=${ML_MINIO_EXTERNAL_BUCKET_NAME?Variable not set}
      - ML_MINIO_TRAINING_BUCKET_NAME=${ML_MINIO_TRAINING_BUCKET_NAME?Variable not set}
      - ML_MINIO_LABELSTUDIO_EXPORT_BUCKET_NAME=${ML_MINIO_LABELSTUDIO_EXPORT_BUCKET_NAME?Variable not set}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI?Variable not set}
      - MLFLOW_REGISTERED_MODEL_NAME=${MLFLOW_REGISTERED_MODEL_NAME?Variable not set}
      - MLFLOW_SHELF_EXPERIMENT_NAME=${MLFLOW_SHELF_EXPERIMENT_NAME?Variable not set}
      - MLFLOW_SHELF_MODEL_NAME=${MLFLOW_SHELF_MODEL_NAME?Variable not set}
      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR?Variable not set}
      - LABEL_STUDIO_URL=${LABEL_STUDIO_URL?Variable not set}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY?Variable not set}
      - BACKEND_URL=http://backend:8000
      - LABEL_STUDIO_SCALE_PROJECT_TITLE=${LABEL_STUDIO_SCALE_PROJECT_TITLE:-scale-products}
      - LABEL_STUDIO_SHELF_PROJECT_TITLE=${LABEL_STUDIO_SHELF_PROJECT_TITLE:-shelf-products}
      - LABEL_STUDIO_EXTERNAL_PROJECT_TITLE=${LABEL_STUDIO_EXTERNAL_PROJECT_TITLE:-external-products}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/utils/health-check/', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: ../self-checkout-ml
      dockerfile: Dockerfile
    volumes:
      - ml-model-cache:/app/.cache

volumes:
  app-db-data:
  minio-data:
  ml-model-cache:
