x-app-environment: &app-environment
  FRONTEND_HOST: ${FRONTEND_HOST?Variable not set}
  ENVIRONMENT: ${ENVIRONMENT?Variable not set}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_VERIFY_TLS: ${S3_VERIFY_TLS:-true}
  S3_CONNECT_TIMEOUT: ${S3_CONNECT_TIMEOUT:-5}
  S3_READ_TIMEOUT: ${S3_READ_TIMEOUT:-30}
  S3_MAX_RETRIES: ${S3_MAX_RETRIES:-3}
  S3_CREATE_BUCKETS: ${S3_CREATE_BUCKETS:-false}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}

x-backend-environment: &backend-environment
  <<: *app-environment
  PROJECT_NAME: ${PROJECT_NAME?Variable not set}
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL?Variable not set}
  DATABASE_URL: ${DATABASE_URL:-}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  SECRET_KEY: ${SECRET_KEY?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  S3_BUCKET: ${S3_BUCKET:-}

x-ml-environment: &ml-environment
  <<: *app-environment
  PROJECT_NAME: Self-Checkout ML
  S3_SHELF_BUCKET: ${S3_SHELF_BUCKET:-}
  S3_SCALE_BUCKET: ${S3_SCALE_BUCKET:-}
  S3_EXTERNAL_BUCKET: ${S3_EXTERNAL_BUCKET:-}
  S3_TRAINING_BUCKET: ${S3_TRAINING_BUCKET:-}
  S3_LABEL_STUDIO_EXPORT_BUCKET: ${S3_LABEL_STUDIO_EXPORT_BUCKET:-}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
  MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-self-checkout-classifier}
  MLFLOW_SHELF_EXPERIMENT_NAME: ${MLFLOW_SHELF_EXPERIMENT_NAME:-self-checkout-shelf-classifier}
  MLFLOW_SHELF_MODEL_NAME: ${MLFLOW_SHELF_MODEL_NAME:-self-checkout-shelf-classifier}
  MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-.cache/model_store}
  LABEL_STUDIO_URL: ${LABEL_STUDIO_URL:-}
  LABEL_STUDIO_API_KEY: ${LABEL_STUDIO_API_KEY:-}
  BACKEND_URL: http://backend:8000
  LABEL_STUDIO_SCALE_PROJECT_TITLE: ${LABEL_STUDIO_SCALE_PROJECT_TITLE:-scale-products}
  LABEL_STUDIO_SHELF_PROJECT_TITLE: ${LABEL_STUDIO_SHELF_PROJECT_TITLE:-shelf-products}
  LABEL_STUDIO_EXTERNAL_PROJECT_TITLE: ${LABEL_STUDIO_EXTERNAL_PROJECT_TITLE:-external-products}

services:
  prestart:
    image: ${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG?Variable not set}
    build:
      context: ../self-checkout-backend
      dockerfile: Dockerfile
    command: bash scripts/prestart.sh
    environment: *backend-environment

  backend:
    image: ${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG?Variable not set}
    restart: always
    depends_on:
      prestart:
        condition: service_completed_successfully
    environment: *backend-environment
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: ../self-checkout-backend
      dockerfile: Dockerfile

  admin:
    image: ${DOCKER_IMAGE_ADMIN?Variable not set}:${TAG?Variable not set}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    build:
      context: ../self-checkout-admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL?Variable not set}

  ml:
    image: ${DOCKER_IMAGE_ML?Variable not set}:${TAG?Variable not set}
    restart: always
    environment: *ml-environment
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/utils/health-check/', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: ../self-checkout-ml
      dockerfile: Dockerfile
    volumes:
      - ml-model-cache:/app/.cache

volumes:
  ml-model-cache:
